name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  validate:
    name: Check release eligibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          python3 .github/scripts/check-release.py "$GITHUB_REF_NAME" "$previous_tag"

  checks:
    needs: validate
    uses: ./.github/workflows/rust-ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ endsWith(matrix.target, '-pc-windows-msvc') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Install the Linux musl toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test the release target
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Verify and package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$("target/$TARGET/release/lazel" --version)
          if [[ "$version" != "lazel ${GITHUB_REF_NAME#v}" ]]; then
            printf 'Release tag %s does not match binary version %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

          archive="lazel-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" LICENSE-APACHE LICENSE-MIT -C "target/$TARGET/release" lazel
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Verify and package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/$env:TARGET/release/lazel.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -cne "lazel $($env:GITHUB_REF_NAME.Substring(1))") {
              throw "Release tag $env:GITHUB_REF_NAME does not match binary version '$version'."
          }

          $archive = "lazel-$env:TARGET.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath $binary, LICENSE-APACHE, LICENSE-MIT -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -LiteralPath "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "dist/$archive.sha256" -Encoding ascii
      - name: Verify Unix installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/install_unix.sh "dist/lazel-$TARGET.tar.gz" "$GITHUB_REF_NAME"
      - name: Verify Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/install_windows.ps1 "dist/lazel-$env:TARGET.zip" $env:GITHUB_REF_NAME
      - name: Verify PowerShell 7 installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install_windows.ps1 "dist/lazel-$env:TARGET.zip" $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@v7
        with:
          name: lazel-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lazel-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "[Full changelog]($changelog_url)" \
            --title "Lazel $GITHUB_REF_NAME"
